<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0d1520"/>
<title>PrefOS · Master</title>

<!-- ICONS + LIBS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
/* ════════════════════════════════════════════════════════════════
   🎨 DESIGN-SYSTEM · Gold/Navy (aus letzeindex_11c_.html übernommen)
   ════════════════════════════════════════════════════════════════ */
:root{
  --bg:#0d1520;
  --bg-deep:#0a1018;
  --card:#111d2e;
  --card-2:#16243a;
  --line:rgba(255,255,255,0.07);
  --line-2:rgba(255,255,255,0.12);
  --text:#e2e8f0;
  --text-dim:rgba(255,255,255,0.5);
  --text-faint:rgba(255,255,255,0.3);

  --gold:#c9a84c;
  --gold-d:#9a7c2e;
  --gold-soft:rgba(201,168,76,0.15);

  --primary:#e07b39;
  --green:#22c55e;
  --blue:#6366f1;
  --red:#ef4444;
  --purple:#a855f7;

  --r-card:12px;
  --r-btn:8px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;overflow-x:hidden}
input,select,textarea,button{font-family:inherit}
select option{background:#1e2a3a;color:var(--text)}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}

input:focus,select:focus,textarea:focus{outline:2px solid rgba(201,168,76,0.4)!important;border-color:rgba(201,168,76,0.4)!important}

/* ── BASIS-KOMPONENTEN ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card)}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.05em}

.btn-pri{padding:10px 16px;font-size:13px;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--gold-d));border:none;border-radius:var(--r-btn);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px;letter-spacing:.04em}
.btn-pri:hover{filter:brightness(1.08)}
.btn-pri:disabled{opacity:.5;cursor:not-allowed}

.btn-sec{padding:9px 14px;font-size:13px;font-weight:600;background:rgba(255,255,255,0.06);border:1px solid var(--line-2);border-radius:var(--r-btn);color:rgba(255,255,255,0.75);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-sec:hover{background:rgba(255,255,255,0.1)}

.btn-pdf{padding:8px 12px;font-size:12px;font-weight:700;background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.3);border-radius:var(--r-btn);color:#818cf8;cursor:pointer;display:inline-flex;align-items:center;gap:6px}

.btn-danger{padding:8px 14px;font-size:12px;font-weight:700;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);border-radius:var(--r-btn);color:var(--red);cursor:pointer;display:inline-flex;align-items:center;gap:6px}

.inp{width:100%;font-size:13px;padding:10px 12px;background:rgba(255,255,255,0.04);border:1px solid var(--line-2);border-radius:7px;color:var(--text)}
.lbl{font-size:10px;font-weight:700;color:var(--text-dim);letter-spacing:.08em;margin-bottom:6px;display:block;text-transform:uppercase}

/* ── LOGIN-SCREEN ── */
.center-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px}
.logo-txt{font-size:28px;font-weight:900;letter-spacing:-.03em;background:linear-gradient(135deg,#e7d18a 25%,var(--gold-d));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}

/* ── SIDEBAR ── */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:240px;background:var(--bg-deep);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:50;transition:transform .25s}
.main-wrap{margin-left:240px;min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:11px 18px;background:rgba(13,21,32,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);min-height:56px}
.content{flex:1;padding:20px;max-width:1280px;width:100%;margin:0 auto}

.hamburger{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:6px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:40}

.nav-section-label{font-size:9px;font-weight:800;color:var(--text-faint);letter-spacing:.12em;padding:14px 16px 6px;text-transform:uppercase}
.btn-nav{display:flex;align-items:center;gap:11px;padding:10px 16px;border:none;border-radius:8px;background:transparent;color:var(--text-dim);cursor:pointer;font-size:13px;font-weight:500;width:calc(100% - 16px);margin:1px 8px;text-align:left;transition:all .15s;letter-spacing:.01em}
.btn-nav:hover{background:rgba(255,255,255,0.04);color:var(--text)}
.btn-nav.active{background:var(--gold-soft);color:var(--gold);font-weight:700}
.btn-nav i{font-size:16px;flex-shrink:0}

/* ── MOBILE ── */
@media(max-width:767px){
  .sidebar{transform:translateX(-240px)}
  .sidebar.open{transform:translateX(0)}
  .main-wrap{margin-left:0}
  .hamburger{display:flex}
  .overlay.show{display:block}
  .hide-mobile{display:none!important}
  .content{padding:14px}
}

/* ── ROLE BADGE ── */
.role-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.06em;border-radius:6px;padding:4px 9px;white-space:nowrap;text-transform:uppercase}
.role-badge.superadmin{color:var(--primary);background:rgba(224,123,57,0.12);border:1px solid rgba(224,123,57,0.35)}
.role-badge.cheftrainer{color:var(--green);background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.35)}
.role-badge.assistent{color:#94a3b8;background:rgba(148,163,184,0.12);border:1px solid rgba(148,163,184,0.35)}
.role-badge.funktionaer{color:var(--blue);background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.35)}
.role-badge.spieler{color:var(--gold);background:var(--gold-soft);border:1px solid rgba(201,168,76,0.35)}

/* ── PLACEHOLDER ── */
.placeholder-view{padding:40px 20px;text-align:center}
.placeholder-view i{font-size:48px;color:var(--text-faint);margin-bottom:16px;display:block}
.placeholder-view h2{font-size:18px;font-weight:700;margin-bottom:8px;color:var(--text)}
.placeholder-view p{font-size:13px;color:var(--text-dim);max-width:420px;margin:0 auto;line-height:1.6}

/* ── STAT-GRID ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media(max-width:600px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat-card .stat-label{font-size:10px;font-weight:700;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.stat-card .stat-value{font-size:24px;font-weight:800;letter-spacing:-.02em}

/* ── TEAM-SWITCHER ── */
.team-switcher{padding:6px 10px;background:rgba(255,255,255,0.05);border:1px solid var(--line-2);border-radius:7px;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;min-width:140px}

/* ── DEMO-MODE BANNER ── */
.demo-banner{background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.25);border-radius:8px;padding:9px 14px;margin-bottom:16px;font-size:11px;color:#86efac;display:flex;align-items:center;gap:8px;font-weight:600}
.demo-banner i{font-size:14px}

/* ── TILE GRID (für Rollen-Auswahl, Onboarding etc.) ── */
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:16px}
.tile{background:var(--card-2);border:1px solid var(--line-2);border-radius:10px;padding:14px;cursor:pointer;transition:all .15s;text-align:left;display:flex;align-items:center;gap:12px}
.tile:hover{border-color:rgba(201,168,76,0.4);transform:translateY(-1px)}
.tile-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile-title{font-size:13px;font-weight:800;color:var(--text);margin-bottom:2px}
.tile-sub{font-size:11px;color:var(--text-dim);line-height:1.4}

/* ── LOCKED-INFO (für Module die der Rolle nicht erlaubt sind) ── */
.locked-view{padding:60px 20px;text-align:center}
.locked-view i{font-size:48px;color:var(--red);margin-bottom:16px;display:block;opacity:.5}

/* ════════════════════════════════════════════════════════════════
   🆕 KADER · Spieler-Verwaltung
   ════════════════════════════════════════════════════════════════ */

.kader-grid{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:640px){.kader-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.kader-grid{grid-template-columns:repeat(3,1fr)}}

.player-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;align-items:center;gap:12px;transition:all .15s}
.player-card:hover{border-color:var(--line-2);transform:translateY(-1px)}
.player-num{width:42px;height:42px;flex-shrink:0;background:linear-gradient(135deg,var(--gold-soft),transparent);border:1px solid rgba(201,168,76,0.35);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:var(--gold);font-variant-numeric:tabular-nums}
.player-info{flex:1;min-width:0}
.player-name{font-size:14px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.player-meta{font-size:11px;color:var(--text-dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-actions{display:flex;gap:4px;flex-shrink:0}

.btn-icon{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:1px solid var(--line-2);border-radius:7px;color:var(--text-dim);cursor:pointer;transition:all .15s}
.btn-icon:hover{background:rgba(255,255,255,0.08);color:var(--text)}
.btn-icon.btn-danger-icon:hover{background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.35);color:var(--red)}
.btn-icon i{font-size:14px}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.65);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal-card{background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:560px;width:100%;max-height:92vh;overflow:auto;animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-card.modal-lg{max-width:760px}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.modal-header h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
.modal-close{background:none;border:none;color:var(--text-dim);font-size:22px;cursor:pointer;padding:4px 8px;border-radius:6px;line-height:1}
.modal-close:hover{background:rgba(255,255,255,0.06);color:var(--text)}
.modal-body{padding:18px 20px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card);flex-wrap:wrap}

/* ── FORM-GRID (für Spieler-Form) ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .span-2{grid-column:1/-1}
@media(max-width:520px){.form-grid{grid-template-columns:1fr}.form-grid .span-2{grid-column:1}}
.form-group{display:flex;flex-direction:column}
.form-checkbox{display:flex;align-items:center;gap:8px;cursor:pointer;padding:9px 12px;background:rgba(255,255,255,0.03);border:1px solid var(--line-2);border-radius:7px;user-select:none}
.form-checkbox input{cursor:pointer;width:16px;height:16px;accent-color:var(--gold)}
.form-checkbox span{font-size:12px;font-weight:600;color:var(--text-dim)}
.form-checkbox.checked span{color:var(--gold)}

/* ── TOAST ── */
.toast-container{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:90vw}
.toast{background:var(--card);border:1px solid var(--line-2);border-radius:8px;padding:10px 16px;font-size:12px;font-weight:600;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,0.4);animation:toastIn .25s ease;pointer-events:auto;display:flex;align-items:center;gap:8px}
.toast.toast-success{border-color:rgba(34,197,94,0.4);color:#86efac}
.toast.toast-error{border-color:rgba(239,68,68,0.4);color:#fca5a5}
.toast.toast-info{border-color:rgba(99,102,241,0.4);color:#a5b4fc}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ── IMPORT PREVIEW TABELLE ── */
.import-preview{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:12px}
.import-preview table{width:100%;border-collapse:collapse;font-size:11px}
.import-preview th{background:var(--card-2);padding:8px;text-align:left;font-weight:700;color:var(--text-dim);position:sticky;top:0;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.import-preview td{padding:6px 8px;border-top:1px solid var(--line);color:var(--text)}
.import-preview tr.row-error{background:rgba(239,68,68,0.08)}
.import-preview tr.row-error td{color:#fca5a5}
.import-preview tr.row-warn{background:rgba(245,158,11,0.08)}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════
     LOGIN-SCREEN · Login + Registrieren als Tabs
     ═══════════════════════════════════════════════════════════════ -->
<div id="loginScreen" class="center-wrap">
  <div class="card" style="padding:32px;width:100%;max-width:400px">

    <!-- LOGO -->
    <div style="text-align:center;margin-bottom:24px">
      <div class="logo-txt" style="font-size:36px">PrefOS</div>
      <div style="font-size:11px;font-weight:800;letter-spacing:.22em;color:var(--text-faint);margin-top:6px">PERFORMANCE OS · MASTER</div>
    </div>

    <!-- TAB SWITCHER -->
    <div style="display:flex;background:rgba(255,255,255,0.04);border:1px solid var(--line-2);border-radius:8px;padding:3px;margin-bottom:20px;gap:3px">
      <button id="tabLogin" onclick="switchAuthTab('login')" style="flex:1;padding:8px;border:none;background:var(--gold-soft);color:var(--gold);border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;letter-spacing:.05em">ANMELDEN</button>
      <button id="tabSignup" onclick="switchAuthTab('signup')" style="flex:1;padding:8px;border:none;background:transparent;color:var(--text-dim);border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;letter-spacing:.05em">REGISTRIEREN</button>
    </div>

    <!-- ── LOGIN FORM ── -->
    <div id="loginForm">
      <div style="margin-bottom:12px">
        <label class="lbl">E-Mail</label>
        <input id="loginEmail" type="email" class="inp" placeholder="name@verein.ch" autocomplete="username"/>
      </div>
      <div style="margin-bottom:18px">
        <label class="lbl">Passwort</label>
        <input id="loginPass" type="password" class="inp" placeholder="••••••••" autocomplete="current-password"/>
      </div>

      <div id="loginErr" style="color:var(--red);font-size:12px;margin-bottom:10px;text-align:center;display:none;background:rgba(239,68,68,0.08);padding:8px;border-radius:6px"></div>

      <button onclick="doLogin()" class="btn-pri" style="width:100%;justify-content:center;padding:12px;font-size:14px;letter-spacing:.05em">Anmelden</button>
    </div>

    <!-- ── SIGNUP FORM ── -->
    <div id="signupForm" style="display:none">
      <div style="margin-bottom:12px">
        <label class="lbl">Vor- und Nachname</label>
        <input id="signupName" type="text" class="inp" placeholder="Max Muster"/>
      </div>
      <div style="margin-bottom:12px">
        <label class="lbl">E-Mail</label>
        <input id="signupEmail" type="email" class="inp" placeholder="name@verein.ch" autocomplete="email"/>
      </div>
      <div style="margin-bottom:12px">
        <label class="lbl">Passwort (min. 6 Zeichen)</label>
        <input id="signupPass" type="password" class="inp" placeholder="••••••••" autocomplete="new-password"/>
      </div>
      <div style="margin-bottom:14px">
        <label class="lbl">Passwort bestätigen</label>
        <input id="signupPass2" type="password" class="inp" placeholder="••••••••" autocomplete="new-password"/>
      </div>

      <div id="signupErr" style="color:var(--red);font-size:12px;margin-bottom:10px;text-align:center;display:none;background:rgba(239,68,68,0.08);padding:8px;border-radius:6px"></div>
      <div id="signupOk" style="color:var(--green);font-size:12px;margin-bottom:10px;text-align:center;display:none;background:rgba(34,197,94,0.08);padding:8px;border-radius:6px"></div>

      <button onclick="doSignup()" class="btn-pri" style="width:100%;justify-content:center;padding:12px;font-size:14px;letter-spacing:.05em">Konto erstellen</button>

      <p style="font-size:10px;color:var(--text-faint);text-align:center;margin-top:12px;line-height:1.5">Nach der Registrierung muss dich dein Verein-Administrator freischalten und einem Team zuweisen.</p>
    </div>

    <!-- FOOTER -->
    <div style="text-align:center;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)">
      <a onclick="openDemoMode()" style="font-size:10px;color:var(--text-faint);cursor:pointer;letter-spacing:.06em">⚙ Tester-Modus (Rollen ohne Login)</a>
    </div>

    <div style="font-size:10px;color:var(--text-faint);text-align:center;margin-top:14px;letter-spacing:.04em">System &amp; Development by Dogus Kaplan</div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     APP-SCREEN
     ═══════════════════════════════════════════════════════════════ -->
<div id="appScreen" style="display:none">

  <!-- OVERLAY (mobile sidebar) -->
  <div class="overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div style="padding:20px 16px 4px;flex:1;overflow-y:auto;min-height:0">

      <!-- LOGO -->
      <div style="margin-bottom:18px;padding:0 8px;display:flex;align-items:center;gap:11px">
        <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-d));display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:900;color:#0a1018;font-size:18px">P</div>
        <div style="min-width:0">
          <div class="logo-txt" style="font-size:20px">PrefOS</div>
          <div id="clubLabel" style="font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--text-faint);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">—</div>
        </div>
      </div>

      <!-- TEAM-SWITCHER (nur sichtbar wenn mehrere Teams) -->
      <div id="teamSwitchWrap" style="display:none;padding:0 8px;margin-bottom:14px">
        <label class="lbl" style="font-size:9px;margin-bottom:4px">AKTIVES TEAM</label>
        <select id="teamSwitch" class="team-switcher" style="width:100%" onchange="switchTeam(this.value)"></select>
      </div>

      <!-- NAVIGATION (dynamisch nach Rolle gefüllt) -->
      <nav id="navigation"></nav>

    </div>

    <!-- FOOTER der Sidebar -->
    <div style="padding:14px 16px;border-top:1px solid var(--line);flex-shrink:0">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <div style="width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0"></div>
        <div style="min-width:0;flex:1">
          <div id="userName" style="font-size:12px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">—</div>
          <div id="userEmail" style="font-size:10px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">—</div>
        </div>
      </div>

/* ═══════════════════════════════════════════════════════════════════
   🎭 ROLLEN-SYSTEM
   ═══════════════════════════════════════════════════════════════════ */

// Rollen-Definitionen
const ROLES = {
  superadmin:  { label:'Super-Admin',  icon:'crown',    color:'var(--primary)' },
  cheftrainer: { label:'Cheftrainer',  icon:'whistle',  color:'var(--green)' },
  assistent:   { label:'Assistent',    icon:'user-plus',color:'#94a3b8' },

};

/**
 * Zentrale Berechtigungs-Funktion.
 * Beispiele:
 *   if(can('tipsu.write')) { ... }
 *   if(can('tipsu.delete')) { ... }
 *   if(can('akademie.solve')) { ... }
 *
 * Action-Schema: "<modul>.<aktion>"
 * Aktionen: read | write | delete | pdf | manage | solve | own
 */
function can(action){
  if(!STATE.profile) return false;
  const role = STATE.profile.role;

  // Super-Admin darf ALLES
  if(role === 'superadmin') return true;

  // Berechtigungs-Regeln pro Rolle
  const RULES = {
    // ── KADER ──
    'kader.read':       ['cheftrainer','assistent','funktionaer'],
    'kader.write':      ['cheftrainer','assistent'],
    'kader.delete':     ['cheftrainer'],

    // ── TIPS/U BEWERTUNGEN ──
    'tipsu.read':       ['cheftrainer','assistent','funktionaer'],
    'tipsu.read.own':   ['spieler'],   // Spieler sieht NUR eigene (aber wir zeigen Spielern KEINE Noten)
    'tipsu.write':      ['cheftrainer','assistent'],
    'tipsu.delete':     ['cheftrainer'],
    'tipsu.pdf':        ['cheftrainer','assistent','funktionaer'],

    // ── LERNZIELE / PHASEN ──
    'goals.read':       ['cheftrainer','assistent','funktionaer','spieler'],
    'goals.read.own':   ['spieler'],
    'goals.write':      ['cheftrainer','assistent'],

    // ── SPIELPLAN / MATCHES ──
    'matches.read':     ['cheftrainer','assistent','funktionaer','spieler'],
    'matches.write':    ['cheftrainer','assistent'],
    'matches.delete':   ['cheftrainer'],
    'matches.pdf':      ['cheftrainer','assistent','funktionaer'],

    // ── ANWESENHEIT (AWK) ──
    'awk.read':         ['cheftrainer','assistent'],
    'awk.write':        ['cheftrainer','assistent'],

    // ── MASTERCLASS (für Trainer/Assistent/Funktionär — Coaching-Inhalte) ──
    // Dies ist die Trainer-Ausbildungsplattform, NICHT die Spieler-Lernplattform!
    'masterclass.view':   ['cheftrainer','assistent','funktionaer'],
    'masterclass.manage': ['cheftrainer'],

    // ── AKADEMIE / LERNPLATTFORM (für Spieler — Lernquiz, Module, Rangliste) ──
    // Dies ist NICHT die Masterclass. Spieler bekommen hier ihre eigenen Lerninhalte.
    // Trainer/Assistent können den Fortschritt sehen und Module für die Spieler freischalten.
    'akademie.solve':     ['spieler'],
    'akademie.manage':    ['cheftrainer'],
    'akademie.view':      ['cheftrainer','assistent'],

    // ── SFV LEHRE & TAKTIKBOARD ──
    'taktik.read':      ['cheftrainer','assistent'],
    'taktik.write':     ['cheftrainer','assistent'],

    // ── CYCLEOS (nur für Frauen/Mädchen-Teams) ──
    'cycleos.read':     ['cheftrainer','assistent'],
    'cycleos.write':    ['cheftrainer','assistent'],
    'cycleos.read.own': ['spieler'],

    // ── VERLAUF / ARCHIV ──
    'verlauf.read':     ['cheftrainer','assistent'],
    'verlauf.pdf':      ['cheftrainer'],

    // ── ADMINISTRATION (NUR SUPERADMIN) ──
    'admin.clubs':       ['superadmin'],
    'admin.teams':       ['superadmin'],
    'admin.users':       ['superadmin'],
    'admin.licenses':    ['superadmin'],
    'admin.features':    ['superadmin']
  };

  const allowedRoles = RULES[action];
  if(!allowedRoles) return false;
  return allowedRoles.includes(role);
}

/**
 * Prüft ob CycleOS für das aktuelle Team verfügbar ist.
 * Bedingungen:
 *   1. Verein hat CycleOS aktiviert (Super-Admin schaltet das frei)
 *   2. Team-Typ ist Frauen oder Mädchen
 */
function isCycleOSAvailable(){
  if(!STATE.team) return false;
  if(!STATE.features.cycleos) return false;
  const teamType = (STATE.team.typ || '').toLowerCase();
  return teamType === 'frauen' || teamType === 'maedchen';
}

/* ═══════════════════════════════════════════════════════════════════
   🔐 LOGIN / LOGOUT
   ═══════════════════════════════════════════════════════════════════ */

async function doLogin(){
  const emailEl = document.getElementById('loginEmail');
  const passEl  = document.getElementById('loginPass');
  if(!emailEl || !passEl){
    // Login-Form wurde überschrieben → wiederherstellen und neu versuchen
    restoreLoginScreen();
    return;
  }
  const email = emailEl.value.trim();
  const pass  = passEl.value;
  const err = document.getElementById('loginErr');
  const ok  = document.getElementById('loginOk');
  if(err) err.style.display = 'none';
  if(ok)  ok.style.display = 'none';

  if(!email || !pass){
    if(err){ err.textContent = 'Bitte E-Mail und Passwort eingeben.'; err.style.display = 'block'; }
    return;
  }

  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error){
      if(err){ err.textContent = 'Login fehlgeschlagen. Bitte E-Mail und Passwort prüfen.'; err.style.display = 'block'; }
      return;
    }
    STATE.user = data.user;
    STATE.mode = 'live';
    await afterLogin();
  }catch(e){
    if(err){ err.textContent = 'Fehler: ' + e.message; err.style.display = 'block'; }
  }
}

async function doLogout(){
  try{ if(STATE.mode === 'live') await sb.auth.signOut(); }catch(e){}
  STATE.user = null;
  STATE.profile = null;
  STATE.club = null;
  STATE.team = null;
  STATE.myTeams = [];
  STATE.mode = 'live';
  document.getElementById('appScreen').style.display = 'none';
  restoreLoginScreen();
}

/**
 * Stellt den originalen Login-Bildschirm wieder her.
 * Wird aufgerufen wenn das innerHTML durch Demo-Modus oder First-Setup
 * überschrieben wurde.
 */
let ORIGINAL_LOGIN_HTML = null;
function saveOriginalLoginHTML(){
  if(ORIGINAL_LOGIN_HTML === null){
    ORIGINAL_LOGIN_HTML = document.getElementById('loginScreen').innerHTML;
  }
}
function restoreLoginScreen(){
  const screen = document.getElementById('loginScreen');
  if(ORIGINAL_LOGIN_HTML && screen.innerHTML !== ORIGINAL_LOGIN_HTML){
    screen.innerHTML = ORIGINAL_LOGIN_HTML;
  }
  screen.style.display = 'flex';
}

/* ═══════════════════════════════════════════════════════════════════
   🚪 ROUTING NACH LOGIN — LIVE über Supabase RPC
   ═══════════════════════════════════════════════════════════════════ */

async function afterLogin(){
  if(STATE.mode === 'demo'){
    // Demo-Daten sind schon gesetzt → direkt App zeigen
    showApp();
    return;
  }

  // EIN RPC-Aufruf liefert: Profil + Club + Teams + Features + Lizenz-Status
  try{
    const { data, error } = await sb.rpc('get_me');

    if(error){
      showLoginError(
        'Datenbank-Fehler beim Abrufen deines Profils:\n\n' + error.message +
        '\n\n→ Ist das SQL-Schema (Schritt 2) bereits in Supabase ausgeführt?'
      );
      await sb.auth.signOut();
      STATE.user = null;
      return;
    }

    // Login funktioniert, aber kein Profil-Eintrag → First-Time Setup zeigen
    if(!data || !data.profile){
      showFirstTimeSetup();
      return;
    }

    // Alles da → State befüllen
    STATE.profile  = data.profile;
    STATE.club     = data.club || { name:'Mein Verein', short:'MV' };
    STATE.myTeams  = data.teams || [];
    STATE.features = {
      cycleos: !!(data.features && data.features.cycleos),
      lms:     !(data.features && data.features.lms === false),
      taktik:  !(data.features && data.features.taktik === false)
    };

    // Team setzen
    if(STATE.myTeams.length > 0){
      STATE.team = STATE.myTeams[0];
    } else if(STATE.profile.role !== 'superadmin'){
      // Trainer/Spieler ohne Team-Zuweisung
      showLoginError(
        'Du hast noch kein Team zugewiesen.\n\n' +
        'Falls du Trainer/Assistent bist: bitte beim Super-Admin melden.\n' +
        'Falls du Spieler bist: dein Trainer muss dich noch einrichten.'
      );
      await sb.auth.signOut();
      STATE.user = null;
      return;
    }

    // Letzten Login-Zeitpunkt aktualisieren (best-effort, nicht kritisch)
    sb.from('profiles').update({ last_login_at: new Date().toISOString() }).eq('id', STATE.user.id).then(()=>{});

    showApp();
  }catch(e){
    showLoginError('Unerwarteter Fehler:\n\n' + e.message);
    try{ await sb.auth.signOut(); }catch(_){}
    STATE.user = null;
  }
}

/**
 * Zeigt eine Fehler-Meldung auf dem Login-Screen.
 * Stellt zuerst das Original-Login-HTML wieder her falls es überschrieben wurde.
 */
function showLoginError(msg){
  document.getElementById('appScreen').style.display = 'none';
  restoreLoginScreen();
  const err = document.getElementById('loginErr');
  const ok = document.getElementById('loginOk');
  if(ok) ok.style.display = 'none';
  if(err){
    err.textContent = msg;
    err.style.display = 'block';
    err.style.whiteSpace = 'pre-wrap';
    err.style.textAlign = 'left';
    err.style.maxHeight = '300px';
    err.style.overflowY = 'auto';
    err.style.fontSize = '11px';
    err.style.padding = '10px';
    err.style.background = 'rgba(239,68,68,0.08)';
    err.style.border = '1px solid rgba(239,68,68,0.3)';
    err.style.borderRadius = '8px';
  }
}

  const roleBadge = document.getElementById('roleBadge');
  roleBadge.className = 'role-badge ' + role;
  roleBadge.innerHTML = `<i class="ti ti-${ROLES[role].icon}"></i> ${ROLES[role].label}`;

  // Team-Switcher (nur wenn mehr als 1 Team)
  const tsWrap = document.getElementById('teamSwitchWrap');
  const tsSelect = document.getElementById('teamSwitch');
  if(STATE.myTeams.length > 1){
    tsWrap.style.display = 'block';
    tsSelect.innerHTML = STATE.myTeams.map(t => `<option value="${t.id}" ${t.id===STATE.team.id?'selected':''}>${t.name}</option>`).join('');
  } else {
    tsWrap.style.display = 'none';
  }

  // Navigation rendern
  renderNavigation();

  // Default-Ansicht
  navigateTo('dashboard');
}

function switchTeam(teamId){
  const t = STATE.myTeams.find(x => x.id === teamId);
  if(!t) return;
  STATE.team = t;
  renderNavigation();   // CycleOS könnte sich ein/ausblenden
  navigateTo(STATE.view);
}

    html += navItem('admin-users','user-cog','Benutzer');
    html += navItem('admin-licenses','license','Lizenzen');
    html += navItem('admin-features','toggle-right','Module aktivieren');

    if(can('tipsu.read')) html += navItem('vergleich','git-compare','Vergleich');
    if(can('goals.read')) html += navItem('goals','target','Lernziele');

    if(can('akademie.view') || can('akademie.manage')){

    html += navLabel('Planung & Wettkampf');

  // Spieler kommen hier NICHT rein — die haben ihre eigene Akademie!
  if(can('masterclass.view') || can('taktik.read')){

function navItem(id, icon, label){
  return `<button class="btn-nav" data-view="${id}" onclick="navigateTo('${id}')"><i class="ti ti-${icon}"></i>${label}</button>`;
}
function navLabel(text){
  return `<div class="nav-section-label">${text}</div>`;
}

function navigateTo(view){
  // Sicherheits-Check
  if(!isViewAllowed(view)){
    renderLockedView();
    return;
  }

  STATE.view = view;

  // Active-State in Sidebar
  document.querySelectorAll('.btn-nav').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });

  // Title oben setzen
  document.getElementById('pageTitle').textContent = viewTitle(view);

  // Render
  renderView(view);

  // Mobile: Sidebar schliessen
  closeSidebar();
}

function viewTitle(view){
  const titles = {
    'dashboard':'Dashboard',
    'admin-clubs':'Vereine verwalten',
    'admin-teams':'Teams verwalten',
    'admin-users':'Benutzer verwalten',
    'admin-licenses':'Lizenzen',
    'admin-features':'Module aktivieren',
    'kader':'Kader',
    'tipsu':'TIPS/U Bewertungen',
    'vergleich':'Spieler-Vergleich',
    'goals':'Lernziele & Phasen',
    'my-profile':'Mein Profil',
    'makro':'Makrozyklus',
    'matches':'Spielplan',
    'awk':'Anwesenheit',
    'masterclass':'Masterclass · Trainer-Ausbildung',
    'akademie':'Spieler-Akademie',
    'lehre':'SFV Lehre',
    'taktik':'Taktikboard Pro',
    'cycleos':'CycleOS',
    'verlauf':'Verlauf / Archiv'
  };
  return titles[view] || view;
}

/**
 * Sicherheits-Gate: prüft ob die aktuelle Rolle die View sehen darf.
 */
function isViewAllowed(view){
  const role = STATE.profile.role;

  // Dashboard immer erlaubt
  if(view === 'dashboard') return true;

  // Admin-Views nur Super-Admin
  if(view.startsWith('admin-')) return role === 'superadmin';

  // View-zu-Permission Mapping
  const map = {
    'kader':      'kader.read',
    'tipsu':      'tipsu.read',
    'vergleich':  'tipsu.read',
    'goals':      'goals.read',
    'my-profile': null,  // Spieler-only, separat geprüft
    'makro':      'awk.read',
    'matches':    'matches.read',
    'awk':        'awk.read',
    'masterclass': null,  // siehe unten (Trainer-LMS)
    'akademie':    null,  // siehe unten (Spieler-LMS)
    'lehre':      'taktik.read',
    'taktik':     'taktik.read',
    'cycleos':    null,  // siehe unten
    'verlauf':    'verlauf.read'
  };

  // Spezielle Checks
  if(view === 'my-profile') return role === 'spieler';
  if(view === 'masterclass') return can('masterclass.view');
  if(view === 'akademie') return can('akademie.solve') || can('akademie.view') || can('akademie.manage');
  if(view === 'cycleos') return isCycleOSAvailable() && (can('cycleos.read') || can('cycleos.read.own'));

  const perm = map[view];
  if(perm === undefined) return false;
  if(perm === null) return true;
  return can(perm);
}

function renderLockedView(){
  document.getElementById('mainContent').innerHTML = `
    <div class="locked-view">
      <i class="ti ti-lock"></i>
      <h2>Kein Zugriff</h2>
      <p style="color:var(--text-dim);max-width:420px;margin:8px auto 0">Du hast keine Berechtigung für diese Ansicht. Falls du denkst dass das falsch ist, wende dich bitte an deinen Verein-Administrator.</p>
    </div>
  `;
}

function renderPlaceholder(container, icon, title, description){
  let badges = '';
  // Zeige welche Aktionen die aktuelle Rolle hier hätte
  const view = STATE.view;
  const actions = [];
  if(view === 'tipsu'){
    if(can('tipsu.write')) actions.push({label:'Schreiben',color:'var(--green)'});
    if(can('tipsu.delete')) actions.push({label:'Löschen',color:'var(--red)'});
    if(can('tipsu.pdf')) actions.push({label:'PDF Export',color:'var(--blue)'});
    if(can('tipsu.read') && !can('tipsu.write')) actions.push({label:'Nur lesen',color:'var(--text-dim)'});
  } else if(view === 'matches'){
    if(can('matches.write')) actions.push({label:'Schreiben',color:'var(--green)'});
    if(can('matches.delete')) actions.push({label:'Löschen',color:'var(--red)'});
    if(can('matches.pdf')) actions.push({label:'PDF Export',color:'var(--blue)'});
  } else if(view === 'kader'){
    if(can('kader.write')) actions.push({label:'Schreiben',color:'var(--green)'});
    if(can('kader.delete')) actions.push({label:'Löschen',color:'var(--red)'});
  } else if(view === 'goals'){
    if(can('goals.write')) actions.push({label:'Schreiben',color:'var(--green)'});
    if(can('goals.read')) actions.push({label:'Lesen',color:'var(--blue)'});
  } else if(view === 'masterclass'){
    if(can('masterclass.manage')) actions.push({label:'Verwalten',color:'var(--gold)'});
    if(can('masterclass.view')) actions.push({label:'Lesen / Lernen',color:'var(--blue)'});
  } else if(view === 'akademie'){
    if(can('akademie.manage')) actions.push({label:'Verwalten',color:'var(--gold)'});
    if(can('akademie.view')) actions.push({label:'Fortschritt sehen',color:'var(--blue)'});
    if(can('akademie.solve')) actions.push({label:'Module lösen',color:'var(--green)'});
  } else if(view === 'cycleos'){
    if(can('cycleos.write')) actions.push({label:'Schreiben',color:'var(--green)'});
    if(can('cycleos.read.own')) actions.push({label:'Nur eigene',color:'var(--gold)'});
  }
  if(actions.length){
    badges = '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px">' +
      actions.map(a => `<span class="badge" style="color:${a.color};background:${a.color}22;border:1px solid ${a.color}44">${a.label}</span>`).join('') +
      '</div>';
  }

  container.innerHTML = `
    ${STATE.mode === 'demo' ? '<div class="demo-banner"><i class="ti ti-info-circle"></i> Du bist im DEMO-Modus · Alle Daten sind nur zum Testen</div>' : ''}

      ${badges}
      <p style="margin-top:20px;font-size:11px;color:var(--text-faint)">Modul wird in einem späteren Schritt gebaut · aktuell nur Platzhalter</p>
    </div>
  `;
}

async function loadPlayers(){
  if(STATE.mode === 'demo'){
    // Im Demo-Modus die Demo-Spieler für das aktuelle Team zurückgeben
    KADER_PLAYERS = DEMO_PLAYERS.filter(p => p.team_id === STATE.team.id);
    return;
  }

  try{
    const { data, error } = await sb
      .from('players')
      .select('*')
      .eq('team_id', STATE.team.id)
      .is('deleted_at', null)
      .order('rueckennr', { ascending: true, nullsFirst: false })
      .order('name', { ascending: true });

    if(error) throw error;
    KADER_PLAYERS = data || [];
  }catch(e){
    KADER_PLAYERS = [];
    showToast('Fehler beim Laden: ' + e.message, 'error');
  }
}

function renderKaderList(){
  const list = document.getElementById('kader-list');
  const statsBox = document.getElementById('kader-stats');
  if(!list) return;

  // Stats
  const total = KADER_PLAYERS.length;
  const tw = KADER_PLAYERS.filter(p => p.is_tw).length;
  const rae = KADER_PLAYERS.filter(p => p.is_rae).length;
  const avgAge = total > 0
    ? Math.round(10 * KADER_PLAYERS.reduce((s,p) => s + (p.geb ? (Date.now() - new Date(p.geb))/31557600000 : 0), 0) / total) / 10
    : 0;

  statsBox.innerHTML = `
    <div class="stat-grid" style="margin-bottom:16px">
      <div class="stat-card"><div class="stat-label">Spieler</div><div class="stat-value">${total}</div></div>
      <div class="stat-card"><div class="stat-label">Torhüter</div><div class="stat-value" style="color:var(--gold)">${tw}</div></div>
      <div class="stat-card"><div class="stat-label">⌀ Alter</div><div class="stat-value" style="color:var(--green)">${avgAge}</div></div>
      <div class="stat-card"><div class="stat-label">RAE-Flag</div><div class="stat-value" style="color:var(--primary)">${rae}</div></div>
    </div>
  `;

  if(total === 0){
    list.innerHTML = `
      <div class="card" style="padding:40px;text-align:center">
        <i class="ti ti-users" style="font-size:48px;color:var(--text-faint);margin-bottom:12px;display:block"></i>
        <h3 style="font-size:15px;font-weight:700;margin-bottom:6px">Noch keine Spieler im Kader</h3>
        <p style="color:var(--text-dim);font-size:12px;max-width:340px;margin:0 auto;line-height:1.5">
          ${can('kader.write')
            ? 'Klick oben auf <b style="color:var(--gold)">"Spieler hinzufügen"</b> um einen einzelnen Spieler zu erfassen, oder auf <b style="color:var(--blue)">"Import"</b> für eine Excel/CSV-Liste.'
            : 'In diesem Team sind noch keine Spieler erfasst.'}
        </p>
      </div>`;
    return;
  }

  // Karten-Grid
  let html = '<div class="kader-grid">';
  KADER_PLAYERS.forEach(p => { html += playerCard(p); });
  html += '</div>';
  list.innerHTML = html;
}

function playerCard(p){
  const age = p.geb ? Math.floor((Date.now() - new Date(p.geb))/31557600000) : '?';
  const fullName = `${p.vorname || ''} ${p.name}`.trim();
  const canWrite = can('kader.write');
  const canDelete = can('kader.delete');

  const meta = [
    p.position,
    age !== '?' ? age + 'J' : null,
    p.fuss,
    p.nationalitaet,
    p.stammverein
  ].filter(Boolean).join(' · ');

  return `
    <div class="player-card" data-id="${esc(p.id)}">
      <div class="player-num">${esc(p.rueckennr || '–')}</div>
      <div class="player-info">
        <div class="player-name">
          ${esc(fullName) || '<span style="color:var(--text-dim)">ohne Name</span>'}
          ${p.is_tw ? '<span class="badge" style="background:var(--gold-soft);color:var(--gold)">TW</span>' : ''}
          ${p.is_rae ? '<span class="badge" style="background:rgba(224,123,57,0.15);color:var(--primary)">RAE</span>' : ''}
        </div>
        <div class="player-meta">${esc(meta) || 'keine Angaben'}</div>
      </div>
      <div class="player-actions">
        ${canWrite ? `<button onclick="openPlayerForm('${esc(p.id)}')" class="btn-icon" title="Bearbeiten"><i class="ti ti-edit"></i></button>` : ''}
        ${canDelete ? `<button onclick="deletePlayer('${esc(p.id)}')" class="btn-icon btn-danger-icon" title="Löschen"><i class="ti ti-trash"></i></button>` : ''}
      </div>
    </div>`;
}

async function savePlayer(playerId){
  const errBox = document.getElementById('pf-err');
  const saveBtn = document.getElementById('pf-save');
  errBox.style.display = 'none';

  // Werte aus dem Formular
  const data = {
    rueckennr: document.getElementById('pf-rueckennr').value.trim() || null,
    name: document.getElementById('pf-name').value.trim(),
    vorname: document.getElementById('pf-vorname').value.trim() || null,
    geb: document.getElementById('pf-geb').value || null,
    fuss: document.getElementById('pf-fuss').value || null,
    nationalitaet: (document.getElementById('pf-nationalitaet').value.trim() || null)?.toUpperCase() || null,
    stammverein: document.getElementById('pf-stammverein').value.trim() || null,
    position: document.getElementById('pf-position').value || null,
    is_tw: document.getElementById('pf-is-tw').checked,
    is_rae: document.getElementById('pf-is-rae').checked,
    notes: document.getElementById('pf-notes').value.trim() || null
  };

  // Validierung
  if(!data.name){
    errBox.textContent = 'Nachname ist Pflicht.';
    errBox.style.display = 'block';
    return;
  }

  saveBtn.disabled = true;
  saveBtn.innerHTML = '<i class="ti ti-loader"></i> Speichern...';

  try{
    if(STATE.mode === 'demo'){
      // Demo-Modus: lokal hinzufügen/updaten
      if(playerId){
        const idx = KADER_PLAYERS.findIndex(p => p.id === playerId);
        if(idx >= 0) KADER_PLAYERS[idx] = { ...KADER_PLAYERS[idx], ...data };
      } else {
        KADER_PLAYERS.push({ id:'demo-' + Date.now(), team_id: STATE.team.id, ...data });
      }
      closeModal();
      renderKaderList();
      showToast(playerId ? 'Spieler aktualisiert' : 'Spieler angelegt', 'success');
      return;
    }

    // LIVE-Modus: in Supabase speichern
    if(playerId){
      const { error } = await sb.from('players').update(data).eq('id', playerId);
      if(error) throw error;
    } else {
      const insertData = { ...data, team_id: STATE.team.id, club_id: STATE.club.id };
      const { error } = await sb.from('players').insert(insertData);
      if(error) throw error;
    }

    closeModal();
    await loadPlayers();
    renderKaderList();
    showToast(playerId ? 'Spieler aktualisiert' : 'Spieler angelegt', 'success');
  }catch(e){
    errBox.textContent = 'Fehler: ' + e.message;
    errBox.style.display = 'block';
  }finally{
    saveBtn.disabled = false;
    saveBtn.innerHTML = '<i class="ti ti-device-floppy"></i> ' + (playerId?'Speichern':'Anlegen');
  }
}

async function deletePlayer(playerId, fromForm){
  const p = KADER_PLAYERS.find(x => x.id === playerId);
  if(!p) return;
  const fullName = `${p.vorname || ''} ${p.name}`.trim();
  if(!confirm(`Spieler "${fullName}" wirklich löschen?\n\nDie Daten werden archiviert und können später wiederhergestellt werden.`)) return;

  try{
    if(STATE.mode === 'demo'){
      KADER_PLAYERS = KADER_PLAYERS.filter(x => x.id !== playerId);
    } else {
      const { error } = await sb.from('players')
        .update({ deleted_at: new Date().toISOString(), is_active: false })
        .eq('id', playerId);
      if(error) throw error;
      await loadPlayers();
    }
    if(fromForm) closeModal();
    renderKaderList();
    showToast(`${fullName} gelöscht`, 'success');
  }catch(e){
    showToast('Fehler: ' + e.message, 'error');
  }
}

let IMPORT_QUEUE = [];

function downloadCSVTemplate(){
  const headers = ['rueckennr','vorname','name','geb','fuss','nationalitaet','stammverein','position','is_tw','is_rae','notes'];
  const rows = [
    ['1', 'Tim', 'Müller', '2012-03-15', 'R', 'CH', 'BSC Old Boys', 'TW', 'ja', 'ja', ''],
    ['10', 'Leart', 'Abdulahi', '2012-07-22', 'L', 'CH', 'BSC Old Boys', 'OM', 'nein', 'nein', '']
  ];
  const csv = '\uFEFF' + [headers, ...rows].map(r => r.map(c => /[,;"\n]/.test(c) ? `"${c.replace(/"/g,'""')}"` : c).join(';')).join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'kader_vorlage.csv';
  a.click();
  URL.revokeObjectURL(url);
}

async function handleImportFile(input){
  const file = input.files[0];
  if(!file) return;
  const result = document.getElementById('importResult');
  result.innerHTML = '<div style="text-align:center;padding:12px;color:var(--text-dim);font-size:12px"><i class="ti ti-loader"></i> Datei wird analysiert...</div>';

  try{
    const isExcel = /\.(xlsx|xls)$/i.test(file.name);
    let rows;
    if(isExcel){
      rows = await parseExcelFile(file);
    } else {
      const text = await file.text();
      rows = parseCSVText(text);
    }

    if(!rows || rows.length === 0){
      result.innerHTML = '<div style="color:var(--red);font-size:12px">Keine Daten in der Datei gefunden.</div>';
      return;
    }

    IMPORT_QUEUE = rows;
    showImportPreview(rows);
    document.getElementById('importBtn').style.display = 'inline-flex';
  }catch(e){
    result.innerHTML = '<div style="color:var(--red);font-size:12px">Fehler beim Lesen: ' + esc(e.message) + '</div>';
  }
}

function parseCSVText(text){
  // BOM entfernen
  text = text.replace(/^\uFEFF/, '');
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if(lines.length < 2) return [];

  // Auto-detect separator: comma or semicolon
  const sep = (lines[0].match(/;/g)||[]).length > (lines[0].match(/,/g)||[]).length ? ';' : ',';

  // Header parsen
  const headers = splitCSVLine(lines[0], sep).map(h => h.trim().toLowerCase());
  const rows = [];
  for(let i=1; i<lines.length; i++){
    const cells = splitCSVLine(lines[i], sep);
    const row = {};
    headers.forEach((h, idx) => { row[h] = (cells[idx] || '').trim(); });
    rows.push(parseRow(row));
  }
  return rows;
}

function splitCSVLine(line, sep){
  const result = [];
  let cur = '';
  let inQuotes = false;
  for(let i=0; i<line.length; i++){
    const c = line[i];
    if(c === '"'){
      if(inQuotes && line[i+1] === '"'){ cur += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if(c === sep && !inQuotes){
      result.push(cur); cur = '';
    } else {
      cur += c;
    }
  }
  result.push(cur);
  return result;
}

async function parseExcelFile(file){
  if(typeof XLSX === 'undefined'){
    throw new Error('XLSX-Library nicht geladen. Bitte CSV verwenden.');
  }
  const buffer = await file.arrayBuffer();
  const wb = XLSX.read(buffer, { type:'array', cellDates:true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const json = XLSX.utils.sheet_to_json(sheet, { header:1, raw:false, dateNF:'yyyy-mm-dd' });
  if(json.length < 2) return [];

  const headers = json[0].map(h => (h || '').toString().trim().toLowerCase());
  const rows = [];
  for(let i=1; i<json.length; i++){
    if(!json[i] || !json[i].some(v => v !== '' && v != null)) continue;
    const row = {};
    headers.forEach((h, idx) => { row[h] = json[i][idx] == null ? '' : json[i][idx].toString().trim(); });
    rows.push(parseRow(row));
  }
  return rows;
}

function parseRow(raw){
  // Mappe Eingaben auf players-Tabelle-Felder
  const out = {
    rueckennr: raw.rueckennr || raw['rückennr'] || raw.nummer || null,
    name: raw.name || raw.nachname || '',
    vorname: raw.vorname || raw.firstname || null,
    geb: parseDate(raw.geb || raw.geburtsdatum || raw.geburtstag),
    fuss: normalizeFuss(raw.fuss || raw.foot),
    nationalitaet: (raw.nationalitaet || raw['nationalität'] || raw.land || '').toUpperCase().substring(0,3) || null,
    stammverein: raw.stammverein || raw.verein || null,
    position: (raw.position || raw.pos || '').toUpperCase() || null,
    is_tw: parseBool(raw.is_tw || raw.tw || raw.torwart || raw.torhüter),
    is_rae: parseBool(raw.is_rae || raw.rae),
    notes: raw.notes || raw.notiz || raw.bemerkung || null,
    _error: null
  };

  if(!out.name) out._error = 'Name fehlt';
  return out;
}

function parseDate(str){
  if(!str) return null;
  str = str.toString().trim();
  // ISO YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}/.test(str)) return str.substring(0,10);
  // DD.MM.YYYY
  let m = str.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  // DD/MM/YYYY
  m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}

function parseBool(v){
  if(v === true || v === 1) return true;
  if(v === false || v === 0 || v == null || v === '') return false;
  const s = v.toString().trim().toLowerCase();
  return ['ja','yes','true','1','x','wahr'].includes(s);
}

function normalizeFuss(v){
  if(!v) return null;
  const s = v.toString().trim().toLowerCase();
  if(['l','left','links'].includes(s)) return 'L';
  if(['r','right','rechts'].includes(s)) return 'R';
  if(['rl','lr','beide','beid','both','beidfüssig','beidfuessig'].includes(s)) return 'R/L';
  return null;
}

function showImportPreview(rows){
  const result = document.getElementById('importResult');
  const total = rows.length;
  const errors = rows.filter(r => r._error).length;
  const ok = total - errors;

  let html = `
    <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <span class="badge" style="background:rgba(34,197,94,0.15);color:var(--green);font-size:11px;padding:4px 10px">✓ ${ok} OK</span>
      ${errors > 0 ? `<span class="badge" style="background:rgba(239,68,68,0.15);color:var(--red);font-size:11px;padding:4px 10px">⚠ ${errors} Fehler</span>` : ''}
      <span class="badge" style="background:rgba(99,102,241,0.15);color:var(--blue);font-size:11px;padding:4px 10px">Total: ${total}</span>
    </div>
    <div class="import-preview">
      <table>
        <thead>
          <tr><th>#</th><th>Nr</th><th>Name</th><th>Vorname</th><th>Geb</th><th>Pos</th><th>Status</th></tr>
        </thead>
        <tbody>
  `;
  rows.slice(0, 50).forEach((r, i) => {
    html += `<tr class="${r._error ? 'row-error' : ''}">
      <td>${i+1}</td>
      <td>${esc(r.rueckennr || '–')}</td>
      <td>${esc(r.name)}</td>
      <td>${esc(r.vorname || '–')}</td>
      <td>${esc(r.geb || '–')}</td>
      <td>${esc(r.position || '–')}</td>
      <td>${r._error ? '<span style="color:var(--red)">'+esc(r._error)+'</span>' : '<span style="color:var(--green)">OK</span>'}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';
  if(rows.length > 50) html += `<div style="font-size:10px;color:var(--text-faint);text-align:center;margin-top:6px">... weitere ${rows.length-50} Zeilen werden ebenfalls importiert</div>`;

  result.innerHTML = html;
}

async function doBulkImport(){
  if(!IMPORT_QUEUE.length) return;
  const validRows = IMPORT_QUEUE.filter(r => !r._error);
  if(validRows.length === 0){
    showToast('Keine gültigen Zeilen zum Importieren', 'error');
    return;
  }

  const btn = document.getElementById('importBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader"></i> Importiere...';

  try{
    // Cleanup: _error-Feld entfernen, team_id + club_id ergänzen
    const records = validRows.map(r => {
      const { _error, ...rest } = r;
      return STATE.mode === 'demo'
        ? { id:'demo-'+Date.now()+'-'+Math.random().toString(36).slice(2,8), team_id: STATE.team.id, ...rest }
        : { ...rest, team_id: STATE.team.id, club_id: STATE.club.id };
    });

    if(STATE.mode === 'demo'){
      KADER_PLAYERS = [...KADER_PLAYERS, ...records];
    } else {
      const { error } = await sb.from('players').insert(records);
      if(error) throw error;
      await loadPlayers();
    }

    closeModal();
    renderKaderList();
    showToast(`${records.length} Spieler erfolgreich importiert`, 'success');
    IMPORT_QUEUE = [];
  }catch(e){
    showToast('Import-Fehler: ' + e.message, 'error');
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-database-import"></i> Importieren';
  }
}

function openModal(html, size){
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  content.className = 'modal-card' + (size === 'lg' ? ' modal-lg' : '');
  content.innerHTML = html;
  overlay.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

function showToast(msg, type){
  const container = document.getElementById('toastContainer');
  if(!container) return;
  const t = document.createElement('div');
  t.className = 'toast toast-' + (type || 'info');
  const icon = type === 'success' ? 'check' : (type === 'error' ? 'alert-triangle' : 'info-circle');
  t.innerHTML = `<i class="ti ti-${icon}"></i> ${esc(msg)}`;
  container.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transition = 'opacity .3s';
    setTimeout(() => t.remove(), 300);
  }, 3000);
}

   ═══════════════════════════════════════════════════════════════════ */

function esc(s){
  if(s == null) return '';
  return s.toString().replace(/[<>"'&]/g, c => ({
    '<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','&':'&amp;'
  }[c]));
}


   Diese Funktion wickelt jede DB-Abfrage so ab dass automatisch nur
   die Daten zurückkommen die der User sehen DARF.
   Wird in Schritt 2 + 3 wirklich verwendet — hier als Vorbereitung.
   ═══════════════════════════════════════════════════════════════════ */

function secureQuery(table){
  if(STATE.mode === 'demo'){
    // Im Demo-Modus: kein echter Query
    return null;
  }

  let query = sb.from(table).select('*');

  // SuperAdmin sieht alles in seinem Verein
  if(STATE.profile.role === 'superadmin'){
    if(STATE.profile.club_id) query = query.eq('club_id', STATE.profile.club_id);
    return query;
  }

  // Spieler darf NUR seine eigenen Daten sehen
  if(STATE.profile.role === 'spieler'){
    if(STATE.profile.player_id){
      query = query.eq('player_id', STATE.profile.player_id);
    } else {
      // Sicherheits-Fallback: gar nichts zurückgeben
      query = query.eq('id', '__never_match__');
    }
    return query;
  }

  // Cheftrainer / Assistent / Funktionär: nur ihre Teams
  const teamIds = STATE.myTeams.map(t => t.id);
  if(teamIds.length === 0){
    query = query.eq('id', '__never_match__');
  } else {
    query = query.in('team_id', teamIds);
  }
  return query;
}
